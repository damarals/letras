name: Incremental Scraping

on:
  schedule:
    - cron: "0 0 * * 0" # Sundays 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write # create releases

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Download latest corpus (start fresh if none)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern corpus.db --dir . || echo "No prior corpus; starting fresh"

      - name: Incremental scrape
        run: uv run letras run --incremental --corpus corpus.db

      - name: Export release
        run: uv run letras export --corpus corpus.db --out dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(date +'%Y%m%d')
          gh release create "v${date}.${{ github.run_number }}" \
            dist/corpus.db dist/lyrics-*.zip dist/RELEASE_NOTES.md \
            --title "Letras ${date}" \
            --notes-file dist/RELEASE_NOTES.md
