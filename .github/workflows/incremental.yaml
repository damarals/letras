name: Incremental Scraping

on:
  schedule:
    - cron: "0 0 * * 0" # Sundays 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write # create releases

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Download latest corpus (start fresh if none)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern corpus.db --dir . || echo "No prior corpus; starting fresh"

      - name: Incremental scrape
        run: uv run letras run --incremental --corpus corpus.db

      - name: Export release
        run: uv run letras export --corpus corpus.db --out dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp=$(date -u +'%Y%m%d')                          # sortable tag
          title_date="${stamp:6:2}${stamp:4:2}${stamp:0:4}"   # DDMMYYYY (BR)
          gh release create "v${stamp}.${{ github.run_number }}" \
            dist/corpus.db dist/letras-txt.zip dist/letras-openlyrics.zip \
            --title "Letras ${title_date}" \
            --notes-file dist/RELEASE_NOTES.md
