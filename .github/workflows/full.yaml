name: Full Scraping

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the full reconcile"
        required: true
        default: "Manual full reconcile"

permissions:
  contents: write # create releases

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Download latest corpus (preserves first_seen; fresh if none)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern corpus.db --dir . || echo "No prior corpus; starting fresh"

      - name: Full scrape
        run: uv run letras run --corpus corpus.db

      - name: Export release
        run: uv run letras export --corpus corpus.db --out dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(date +'%Y%m%d')
          gh release create "v${date}.${{ github.run_number }}" \
            dist/corpus.db dist/lyrics-*.zip dist/RELEASE_NOTES.md \
            --title "Letras ${date} (full)" \
            --notes-file dist/RELEASE_NOTES.md
